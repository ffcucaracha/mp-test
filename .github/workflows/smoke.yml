name: Docker smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Verify seeded users and fields
        run: |
          curl --fail http://localhost:8000/api/users
          curl --fail http://localhost:8000/api/users/1/fields

      - name: Verify privacy and visit request flow
        run: |
          curl --fail -X PUT http://localhost:8000/api/fields/3/privacy \
            -H 'Content-Type: application/json' \
            -d '{"owner_id":2,"privacy_variant":"B"}'

          curl --fail 'http://localhost:8000/api/public/fields/3?viewer_id=1' > /tmp/field-before.json
          python3 - <<'PY'
          import json
          with open('/tmp/field-before.json') as f:
              field = json.load(f)
          assert field['privacy_variant'] == 'B'
          assert field['details_visible'] is False
          assert field['name'] is None
          assert field['latitude'] is None
          PY

          curl --fail -X POST http://localhost:8000/api/fields/3/visit-requests \
            -H 'Content-Type: application/json' \
            -d '{"requester_id":1,"message":"Хочу посмотреть поле"}' > /tmp/request.json

          REQUEST_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/request.json') as f:
              print(json.load(f)['id'])
          PY
          )

          curl --fail http://localhost:8000/api/users/2/visit-requests/incoming

          curl --fail -X PUT "http://localhost:8000/api/visit-requests/${REQUEST_ID}" \
            -H 'Content-Type: application/json' \
            -d '{"owner_id":2,"status":"approved"}'

          curl --fail 'http://localhost:8000/api/public/fields/3?viewer_id=1' > /tmp/field-after.json
          python3 - <<'PY'
          import json
          with open('/tmp/field-after.json') as f:
              field = json.load(f)
          assert field['details_visible'] is True
          assert field['name'] == 'Берёзовка'
          assert field['latitude'] is not None
          assert field['visit_request_status'] == 'approved'
          PY

      - name: Verify publications and social feed
        run: |
          curl --fail 'http://localhost:8000/api/feed?viewer_id=1' > /tmp/feed-before.json
          python3 - <<'PY'
          import json
          with open('/tmp/feed-before.json') as f:
              feed = json.load(f)
          assert len(feed) >= 2
          assert all('healthy_count' in post and 'comments' in post for post in feed)
          PY

          PHOTO='data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2210%22%20height=%2210%22%3E%3Crect%20width=%2210%22%20height=%2210%22%20fill=%22green%22/%3E%3C/svg%3E'
          curl --fail -X POST http://localhost:8000/api/posts \
            -H 'Content-Type: application/json' \
            -d "{\"author_id\":1,\"field_id\":1,\"text\":\"Тестовая публикация\",\"status\":\"problem\",\"photo_data_url\":\"${PHOTO}\",\"latitude\":54.9914,\"longitude\":73.3645}" > /tmp/post.json

          POST_ID=$(python3 - <<'PY'
          import json
          with open('/tmp/post.json') as f:
              post = json.load(f)
          assert post['field_name'] == 'Северное поле'
          assert post['status'] == 'problem'
          print(post['id'])
          PY
          )

          curl --fail -X PUT "http://localhost:8000/api/posts/${POST_ID}/reaction" \
            -H 'Content-Type: application/json' \
            -d '{"user_id":2,"value":1}' > /tmp/reacted.json
          python3 - <<'PY'
          import json
          with open('/tmp/reacted.json') as f:
              post = json.load(f)
          assert post['healthy_count'] == 1
          assert post['score'] == 1
          PY

          curl --fail -X POST "http://localhost:8000/api/posts/${POST_ID}/comments" \
            -H 'Content-Type: application/json' \
            -d '{"author_id":2,"text":"Проверю у себя на поле"}' > /tmp/commented.json
          python3 - <<'PY'
          import json
          with open('/tmp/commented.json') as f:
              post = json.load(f)
          assert len(post['comments']) == 1
          assert post['comments'][0]['text'] == 'Проверю у себя на поле'
          PY

      - name: Verify analytics metrics and neighbors
        run: |
          curl --fail -X POST 'http://localhost:8000/api/neighbors/2?user_id=1' > /tmp/neighbor.json
          curl --fail 'http://localhost:8000/api/neighbors?user_id=1' > /tmp/neighbors.json
          python3 - <<'PY'
          import json
          with open('/tmp/neighbors.json') as f:
              neighbors = json.load(f)
          assert any(item['user']['id'] == 2 for item in neighbors)
          PY

          curl --fail 'http://localhost:8000/api/neighbors/2/profile?user_id=1' > /tmp/neighbor-profile.json
          python3 - <<'PY'
          import json
          with open('/tmp/neighbor-profile.json') as f:
              profile = json.load(f)
          assert profile['id'] == 2
          PY

          curl --fail 'http://localhost:8000/api/internal/metrics' > /tmp/metrics.json
          python3 - <<'PY'
          import json
          with open('/tmp/metrics.json') as f:
              metrics = json.load(f)
          assert metrics['activation']['users'] >= 4
          assert metrics['activation']['fields_with_location'] >= 4
          assert metrics['social']['neighbors'] >= 1
          assert metrics['events'].get('neighbor_added', 0) >= 1
          assert metrics['events'].get('neighbor_profile_opened', 0) >= 1
          assert metrics['events'].get('feed_opened', 0) >= 1
          assert 'A' in metrics['privacy_experiment'] and 'B' in metrics['privacy_experiment']
          PY

          curl --fail -X DELETE 'http://localhost:8000/api/neighbors/2?user_id=1'

      - name: Verify frontend
        run: curl --fail http://localhost:5173

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
