services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agroconnect
      POSTGRES_USER: agroconnect
      POSTGRES_PASSWORD: agroconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroconnect -d agroconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agroconnect:agroconnect@db:5432/agroconnect
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
      PLANT_HEALTH_PROVIDER: ${PLANT_HEALTH_PROVIDER:-kindwise}
      CROP_HEALTH_API_KEY: ${CROP_HEALTH_API_KEY:-}
      CROP_HEALTH_API_URL: ${CROP_HEALTH_API_URL:-https://crop.kindwise.com/api/v1/identification}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      PLANTVILLAGE_MODEL_DIR: ${PLANTVILLAGE_MODEL_DIR:-/app/models/plantvillage}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
